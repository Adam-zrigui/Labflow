name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: labflow_test
          POSTGRES_PASSWORD: labflow_test
          POSTGRES_DB: labflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://labflow_test:labflow_test@localhost:5432/labflow_test
      TEST_DATABASE_URL: postgresql://labflow_test:labflow_test@localhost:5432/labflow_test
      SESSION_SECRET: integration-test-secret-at-least-32-chars!!
      FIREBASE_ADMIN_PROJECT_ID: test-project
      FIREBASE_ADMIN_CLIENT_EMAIL: test@test.iam.gserviceaccount.com
      FIREBASE_ADMIN_PRIVATE_KEY: test-key
      STRIPE_SECRET_KEY: sk_test_fake
      STRIPE_WEBHOOK_SECRET: whsec_test
      INSTRUMENT_WEBHOOK_SECRET: test-instrument-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsx prisma/seed.ts
      - run: pnpm test:integration
