apiVersion: apps/v1
kind: Deployment
metadata:
  name: labflow
  labels:
    app: labflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: labflow
  template:
    metadata:
      labels:
        app: labflow
    spec:
      containers:
        - name: labflow
          image: labflow:0.1.0
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: labflow-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              memory: "512Mi"
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
